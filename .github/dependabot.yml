version: 2
updates:
  # Python dependencies (reads pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Bundle minor + patch bumps into one PR to avoid PR sprawl; major bumps
      # still arrive individually for careful review.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # numpy is deliberately capped (<2.4) to avoid torchvision deprecation
      # warnings; let Dependabot raise the floor but not fight the ceiling.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # pre-commit hook revisions (.pre-commit-config.yaml). Without this the hook
  # pins drift from the versions CI lints with, so local commits pass hooks
  # that CI then rejects.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns: ["*"]
