name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest command or snippet that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Output of `python verify_install.py`, or at minimum your Python, torch
        and torchvision versions and your OS. The project requires Python 3.11+
        and torch 2.6+.
      render: shell
    validations:
      required: true
